apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-rag
  labels:
    app: rag-project
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: rag-project
  template:
    metadata:
      labels:
        app: rag-project
    spec:
      containers:
        - name: rag-container
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8000
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
