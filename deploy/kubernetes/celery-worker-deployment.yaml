apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-worker
  namespace: rag
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rag-worker
  template:
    metadata:
      labels:
        app: rag-worker
    spec:
      containers:
      - name: worker
        image: myregistry/rag-worker:latest
        command: ["celery", "-A", "app.workers.celery_app", "worker", "--loglevel=info"]
        env:
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: rag-secrets
              key: openai-key
        - name: PINECONE_API_KEY
          valueFrom:
            secretKeyRef:
              name: rag-secrets
              key: pinecone-key
        - name: PINECONE_ENVIRONMENT
          valueFrom:
            secretKeyRef:
              name: rag-secrets
              key: pinecone-environment
        - name: PINECONE_INDEX_NAME
          valueFrom:
            secretKeyRef:
              name: rag-secrets
              key: pinecone-index-name
        - name: REDIS_URL
          value: "redis://redis-service:6379/0"
        - name: CELERY_BROKER_URL
          value: "redis://redis-service:6379/1"
        - name: CELERY_RESULT_BACKEND
          value: "redis://redis-service:6379/2"
        envFrom:
        - configMapRef:
            name: rag-config
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 2
            memory: 4Gi